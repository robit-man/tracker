<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracker Storage</title>
<style>
  body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; color: #111; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 13px; }
  .muted { color: #666; font-size: 12px; }
  label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 8px 0; }
  select, button { width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; }
  button { cursor: pointer; }
  #status { margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<h1>Tracker Distributed Storage</h1>
<p class="muted" id="presence">Background worker: checking…</p>
<label><input type="checkbox" id="enabled"> Contribute storage in background</label>
<label>Scope
<select id="scope">
<option value="room">This room</option>
<option value="global">Global mesh</option>
</select>
</label>
<div class="row"><span>Last heartbeat</span><strong id="heartbeat">—</strong></div>
<button id="save">Save</button>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script>
</body>
</html>
